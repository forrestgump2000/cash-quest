<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;background:linear-gradient(#f5a25d 0%,#e87a52 40%,#7a3d5a 75%,#2a1a30 100%);overflow:hidden;font-family:'Nunito'}
.sun{position:absolute;left:760px;top:120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(#fff3c0,#ffc93c 60%,rgba(255,201,60,0) 72%)}
svg.scene{position:absolute;left:0;bottom:0}
h1{position:absolute;left:60px;top:70px;margin:0;font-family:'Lilita One';font-weight:400;font-size:150px;line-height:.88;color:#ffc93c;text-shadow:0 8px 0 #7a4b00,0 18px 40px rgba(0,0,0,.45);letter-spacing:3px}
h1 span{color:#fff;display:block}
p{position:absolute;left:66px;top:360px;margin:0;font-size:32px;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.6);font-weight:800}
.chips{position:absolute;left:62px;top:420px;display:flex;flex-wrap:wrap;gap:10px;width:640px}
.chip{background:rgba(0,0,0,.45);color:#fff;padding:8px 16px;border-radius:30px;font-size:22px;font-weight:800;border:2px solid rgba(255,201,60,.6)}
img{position:absolute;right:70px;top:110px;width:330px;height:330px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
</style></head><body><div class="wrap">
<div class="sun"></div>
<svg class="scene" width="1200" height="300" viewBox="0 0 1200 300">
 <path d="M0 210 L60 150 L130 180 L200 120 L280 175 L360 140 L430 190 L520 130 L600 185 L700 140 L780 170 L880 110 L960 165 L1050 125 L1130 170 L1200 140 L1200 300 L0 300Z" fill="#4a2a3a"/>
 <rect x="0" y="230" width="1200" height="70" fill="#2a1a24"/>
 <g fill="#ffc93c" opacity=".9"><circle cx="300" cy="245" r="9"/><circle cx="640" cy="255" r="7"/><circle cx="820" cy="240" r="10"/></g>
</svg>
<h1>CASH<span>QUEST</span></h1>
<p>Find treasure. Sell it. Get rich.</p>
<div class="chips"><div class="chip">📡 Detectors</div><div class="chip">🔦 Flashlights</div><div class="chip">🍀 Luck</div><div class="chip">🏛️ 5 Locations</div></div>
<img src="icon.png">
</div></body></html>
